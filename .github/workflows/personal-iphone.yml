name: Build personal iPhone IPA
on:
  push:
    branches: [codex/lionello-iphone]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned dependencies
        run: |
          git clone https://github.com/norsehorse-dev/PassPonyCore.git ../PassPonyCore
          git -C ../PassPonyCore checkout 222fe1eb59eaa50dd45b5be2d2770be3121a132b
          git clone https://github.com/norsehorse-dev/AgePonyiOS.git ../AgePony
          git -C ../AgePony checkout 788f596df6027ce4e629acd41d0f68ffea06074d
          git clone https://github.com/norsehorse-dev/NorseHorsePGPCore.git ../NorseHorsePGPCore
          git -C ../NorseHorsePGPCore checkout 891670cd4806fdf26927c37f73fb1447b0d16887
          bash scripts/prepare-pgpcore.sh
      - run: brew install xcodegen
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/passponycore-cargo-target
          key: passpony-core-${{ runner.os }}-${{ runner.arch }}-222fe1e-rust195-lto-off-v1
      - name: Build shared framework
        env:
          PASSPONY_CORE: ${{ github.workspace }}/../PassPonyCore
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: bash scripts/build-core.sh
      - name: Install signing certificate and profiles
        env:
          APPLE_P12: ${{ secrets.PASSPONY_IOS_P12 }}
          APPLE_P12_PASSWORD: ${{ secrets.PASSPONY_IOS_P12_PASSWORD }}
          APPLE_APP_PROFILE: ${{ secrets.PASSPONY_IOS_APP_PROFILE }}
          APPLE_EXTENSION_PROFILE: ${{ secrets.PASSPONY_IOS_EXTENSION_PROFILE }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          for name, target in [('APPLE_P12', 'signing.p12'), ('APPLE_APP_PROFILE', 'main.mobileprovision'), ('APPLE_EXTENSION_PROFILE', 'extension.mobileprovision')]:
              value = os.environ.get(name)
              if not value: raise SystemExit(f'{name} is missing')
              (root / target).write_bytes(base64.b64decode(value, validate=True))
          PY
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/signing.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/signing.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/signing.keychain-db"
          security import "$RUNNER_TEMP/signing.p12" -k "$RUNNER_TEMP/signing.keychain-db" -P "$APPLE_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/signing.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/signing.keychain-db"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          for profile in "$RUNNER_TEMP/main.mobileprovision" "$RUNNER_TEMP/extension.mobileprovision"; do
            security cms -D -i "$profile" > "$RUNNER_TEMP/profile.plist"
            uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
            cp "$profile" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
          done
      - name: Archive and export IPA
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild archive -project PassPony.xcodeproj -scheme PassPony -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/PassPony.xcarchive" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=FE3JVHBHV2
          python3 - <<'PY'
          import os, plistlib
          options = {'method':'app-store-connect', 'signingStyle':'manual', 'teamID':'FE3JVHBHV2', 'provisioningProfiles': {'com.lunesu.passpony.enclave':'Builder store com.lunesu.passpony.enclave', 'com.lunesu.passpony.enclave.autofill':'Builder store com.lunesu.passpony.enclave.autofill'}}
          with open(os.path.join(os.environ['RUNNER_TEMP'],'ExportOptions.plist'),'wb') as f: plistlib.dump(options,f)
          PY
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/PassPony.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export"
      - uses: actions/upload-artifact@v4
        with:
          name: passpony-personal-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 3
